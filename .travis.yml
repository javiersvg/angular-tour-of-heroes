dist: trusty

language: node_js
node_js:
  - "10"

addons:
  chrome: stable
  sonarcloud:
    organization: javiersvg-github
    token: ${SONAR_TOKEN}
  apt:
    packages:
      - docker-ce

env:
  - DOCKER_COMPOSE_VERSION=1.25.2

before_install:
  - sudo rm /usr/local/bin/docker-compose
  - curl -L https://github.com/docker/compose/releases/download/${DOCKER_COMPOSE_VERSION}/docker-compose-`uname -s`-`uname -m` > docker-compose
  - chmod +x docker-compose
  - sudo mv docker-compose /usr/local/bin

cache:
  directories:
     - ./node_modules

install:
  - npm install

script:
  - npm run test -- --no-watch --no-progress --browsers=ChromeHeadlessCI --code-coverage
  - npm run e2e -- --protractor-config=e2e/protractor-ci.conf.js
  - sonar-scanner
  - docker-compose up -d
  - docker run --network=tour-of-heroes-net -v `pwd`:`pwd` -w `pwd` --name tests openjdk:11 ./gradlew test